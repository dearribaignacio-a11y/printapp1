<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print · Panel de gestión</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-text">
        <strong>Print</strong>
        <small>Gráfica y papelería</small>
      </span>
    </div>

    <nav class="nav" id="nav">
      <a class="nav-item" href="#resumen" data-view="resumen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Resumen</span>
      </a>
      <a class="nav-item" href="#horas" data-view="horas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
        <span>Ventas por hora</span>
      </a>
      <a class="nav-item" href="#productos" data-view="productos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5 12 4l9 4.5-9 4.5-9-4.5Z"/><path d="M3 8.5V16l9 4.5L21 16V8.5"/><path d="M12 13v7.5"/></svg>
        <span>Productos</span>
      </a>
      <a class="nav-item" href="#movimientos" data-view="movimientos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2"/><circle cx="3.5" cy="12" r="1.2"/><circle cx="3.5" cy="18" r="1.2"/></svg>
        <span>Movimientos</span>
      </a>
      <a class="nav-item" href="#stock" data-view="stock">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V9"/><path d="M10 13.5h4"/></svg>
        <span>Stock</span>
      </a>

      <a class="nav-item nav-item-destacado" href="#asistente" data-view="asistente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-5.5A8 8 0 0 1 11 4h2a8 8 0 0 1 8 8Z"/><path d="M9 11h6M9 14.5h3.5"/></svg>
        <span>Asistente</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <span class="dot"></span>
      <div>
        <strong id="foot-fecha">—</strong>
        <small>Jornada en curso</small>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="view-title">—</h1>
        <p id="view-sub">—</p>
      </div>
      <div class="topbar-meta" id="topbar-meta"></div>
    </header>

    <section class="view" id="view" tabindex="-1"></section>
  </main>

</div>

<script src="data.js"></script>
<script src="calc.js"></script>
<script src="chat.js"></script>
<script src="app.js"></script>
</body>
</html>
